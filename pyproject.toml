[project]
name = "it-ticket-service"
version = "0.1.0"
description = "Mikrousługa obsługująca zgłoszenia IT (LAB1 — PAWOoM)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<2.1",
    "starlette>=0.40,<0.48",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
